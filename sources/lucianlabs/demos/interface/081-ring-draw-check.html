/* lucianLabs UI 요소 — 공통 테마 토큰 (라이트 / 다크)
   라이트 기본값 → 시스템이 다크면 다크 → data-theme으로 명시하면 그 값을 우선합니다.
   요소 CSS는 --ux-* 토큰만 참조하므로, 프로젝트 테마 변수에 이 값을 매핑하면 됩니다. */
:root{
  color-scheme:light;
  --ux-page:#F4F2EE;
  --ux-surface:#FFFFFF;
  --ux-surface-2:#F5F3EF;
  --ux-surface-3:#EAE7E1;
  --ux-ink:#16151B;
  --ux-ink-2:#57535F;
  --ux-ink-3:#8E8A97;
  --ux-line:rgba(22,21,27,.09);
  --ux-line-2:rgba(22,21,27,.17);
  --ux-accent:#6A57F2;
  --ux-accent-2:#2F8FE0;
  --ux-accent-soft:rgba(106,87,242,.12);
  --ux-accent-ink:#FFFFFF;
  --ux-mint:#119C72;
  --ux-warn:#D6731E;
  --ux-danger:#D93A55;
  --ux-glass:rgba(255,255,255,.58);
  --ux-glass-line:rgba(255,255,255,.85);
  --ux-shadow:rgba(40,30,80,.14);
  --ux-shadow-strong:rgba(40,30,80,.3);
  --ux-grad:linear-gradient(120deg,#7B61FF,#3D8BFF 55%,#1FB89A);
  --ux-ease:cubic-bezier(.2,.8,.2,1);
  --ux-spring:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme:dark){

    color-scheme:dark;
    --ux-page:#07080D;
    --ux-surface:#13141C;
    --ux-surface-2:#1A1B25;
    --ux-surface-3:#252632;
    --ux-ink:#F4F0E8;
    --ux-ink-2:rgba(244,240,232,.68);
    --ux-ink-3:rgba(244,240,232,.42);
    --ux-line:rgba(255,255,255,.08);
    --ux-line-2:rgba(255,255,255,.16);
    --ux-accent:#B7A4FF;
    --ux-accent-2:#7DB4FF;
    --ux-accent-soft:rgba(183,164,255,.15);
    --ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;
    --ux-danger:#FF7D8C;
    --ux-glass:rgba(255,255,255,.07);
    --ux-glass-line:rgba(255,255,255,.18);
    --ux-shadow:rgba(0,0,0,.45);
    --ux-shadow-strong:rgba(0,0,0,.72);
    --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
  }
}

  color-scheme:dark;

/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}
</style>
<style>

<body>
<button class="ux-theme-btn" type="button" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">Light / Dark</button>
<style>
.u081{position:relative;width:340px;height:460px;display:flex;flex-direction:column;align-items:center;padding:26px 22px 22px;border-radius:30px;background:var(--ux-surface);box-shadow:0 0 0 1px var(--ux-line),0 30px 60px -36px var(--ux-shadow-strong);overflow:hidden}
.u081-sum{width:100%;padding:16px;border-radius:20px;background:var(--ux-surface-2);transition:opacity .4s,transform .5s var(--ux-ease)}

.u081-card{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding:12px 14px;border-radius:16px;box-shadow:inset 0 0 0 1.5px var(--ux-line-2);font-size:13.5px;font-weight:700}

.u081-opt{display:flex;justify-content:space-between;width:100%;padding:12px 4px 0;font-size:13px;font-weight:650;color:var(--ux-ink-3)}
.u081-opt b{color:var(--ux-ink);font-weight:750}
.u081-opt b.m{color:var(--ux-mint)}
.u081-stage{position:relative;width:100%;flex:1;display:flex;align-items:flex-end;justify-content:center}

.u081-go:active{transform:scale(.97)}
.u081-go:focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.u081-go span{transition:opacity .2s}
.u081.is-run .u081-go,.u081.is-ok .u081-go{width:56px;border-radius:50%;pointer-events:none}
.u081.is-run .u081-go span,.u081.is-ok .u081-go span{opacity:0}
.u081-ring{pointer-events:none;position:absolute;left:50%;bottom:-12px;width:80px;height:80px;margin-left:-40px;transform:rotate(-90deg);opacity:0;transition:opacity .3s}
.u081.is-run .u081-ring,.u081.is-ok .u081-ring{opacity:1;transition-delay:.25s}
.u081-ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.u081-ring .t{stroke:var(--ux-surface-3)}
.u081-ring .p{stroke:var(--ux-accent);stroke-dasharray:100;stroke-dashoffset:calc(100 - var(--p,0) * 100);transition:stroke .4s}
.u081.is-ok .u081-ring .p{stroke:var(--ux-mint)}
.u081-ck{position:absolute;left:50%;bottom:16px;width:24px;height:24px;margin-left:-12px;fill:none;stroke:var(--ux-page);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.u081-ck path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .45s var(--ux-ease) .2s}
.u081.is-ok .u081-go{background:var(--ux-mint)}
.u081.is-ok .u081-ck{stroke:var(--ux-accent-ink)}
.u081.is-ok .u081-ck path{stroke-dashoffset:0}
.u081-steps{display:flex;gap:6px;justify-content:center;margin:22px 0 4px;height:24px;font-size:12px;font-weight:700;color:var(--ux-ink-3);opacity:0;transition:opacity .3s}
.u081.is-run .u081-steps,.u081.is-ok .u081-steps{opacity:1}
.u081-steps span{display:inline-flex;align-items:center;gap:5px;transition:color .3s}
.u081-steps span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ux-line-2);transition:background-color .3s,transform .4s var(--ux-spring)}
.u081-steps span.on{color:var(--ux-ink)}
.u081-steps span.on::before{background:var(--ux-accent);transform:scale(1.3)}
.u081.is-ok .u081-steps span.on::before{background:var(--ux-mint)}
.u081-sr{position:absolute;width:1px;height:1px;margin:0;overflow:hidden;clip:rect(0 0 0 0)}
.u081-rec{position:absolute;left:16px;right:16px;bottom:16px;top:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:20px 18px 16px;border-radius:22px;background:var(--ux-surface-2);transform:translateY(110%);transition:transform .6s var(--ux-spring);text-align:center}
.u081.is-rec .u081-rec{transform:none}
.u081.is-rec .u081-sum,.u081.is-rec .u081-card,.u081.is-rec .u081-opt,.u081.is-rec .u081-steps{opacity:0;transform:translateY(-20px);transition:opacity .4s,transform .5s var(--ux-ease)}
.u081.is-rec .u081-stage{opacity:0;transition:opacity .3s}
.u081-stage{transition:opacity .3s}
.u081-rec i{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:var(--ux-mint);color:var(--ux-accent-ink);box-shadow:0 0 0 8px color-mix(in srgb,var(--ux-mint) 16%,transparent)}
.u081-rec i svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.u081-rec::before{content:"";position:absolute;left:0;right:0;top:-8px;height:16px;background:radial-gradient(circle 8px at 8px 0,transparent 98%,var(--ux-surface-2)) 0 8px/16px 8px repeat-x}
.u081-rec b{display:block;font-size:20px;font-weight:850;letter-spacing:-.04em}
.u081-rec p{margin:6px 0 14px;font-size:13px;color:var(--ux-ink-3)}
.u081-rec dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0 0 16px;text-align:left;font-size:12.5px}
.u081-rec dt{color:var(--ux-ink-3);font-weight:650}
.u081-rec dd{margin:0;text-align:right;font-weight:750;font-variant-numeric:tabular-nums}
.u081-rec button{width:100%;height:46px;border:0;border-radius:14px;background:var(--ux-ink);color:var(--ux-page);font-size:14px;font-weight:750}
.u081-rec button:focus-visible{outline:2px solid var(--ux-accent);outline-offset:2px}
</style>
<div class="ux u081">
  <div class="u081-sum"><div><span>Daily Bottle 500 · Coral</span><span>₩29,000</span></div><div><span>Shipping</span><span>₩3,000</span></div><div class="t"><span>Total</span><span>₩32,000</span></div></div>

</div>
<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var go = root.querySelector('.u081-go'), ring = root.querySelector('.u081-ring'), steps = root.querySelectorAll('.u081-steps span');
  var rec = root.querySelector('.u081-rec'), back = rec.querySelector('button'), sr = root.querySelector('.u081-sr');
  var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var raf = 0, ts = [];
  function later(fn, ms) { ts.push(setTimeout(function () { if (root.isConnected) fn(); }, ms)); }
  function run() {
    root.classList.add('is-run'); sr.textContent = 'Processing your payment';
    var t0 = performance.now(), DUR = rm ? 600 : 2600, delay = rm ? 0 : 350;
    (function step(now) {
      if (!root.isConnected) return;
      var k = Math.max(0, Math.min(1, (now - t0 - delay) / DUR)), e = 1 - Math.pow(1 - k, 2.2);
      ring.style.setProperty('--p', e.toFixed(4));
      steps.forEach(function (s, i) { s.classList.toggle('on', e >= [0.02, 0.45, 0.999][i]); });
      if (k < 1) { raf = requestAnimationFrame(step); return; }
      root.classList.remove('is-run'); root.classList.add('is-ok'); sr.textContent = 'Payment complete';
      later(function () { root.classList.add('is-rec'); rec.setAttribute('aria-hidden', 'false'); back.tabIndex = 0; back.focus({ preventScroll: true }); }, rm ? 0 : 900);
    })(t0);
  }
  go.addEventListener('click', run);
  back.addEventListener('click', function () {
    cancelAnimationFrame(raf); ts.forEach(clearTimeout); ts = [];
    root.classList.remove('is-run', 'is-ok', 'is-rec'); rec.setAttribute('aria-hidden', 'true'); back.tabIndex = -1;
    ring.style.setProperty('--p', 0); steps.forEach(function (s) { s.classList.remove('on'); });
    go.focus({ preventScroll: true });
  });
})();
</script>
