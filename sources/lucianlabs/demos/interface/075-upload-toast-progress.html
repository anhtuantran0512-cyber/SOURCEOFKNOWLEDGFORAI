<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upload progress panel · lucianLabs UI</title>
<style>
/* lucianLabs UI 요소 — 공통 테마 토큰 (라이트 / 다크)
   라이트 기본값 → 시스템이 다크면 다크 → data-theme으로 명시하면 그 값을 우선합니다.
   요소 CSS는 --ux-* 토큰만 참조하므로, 프로젝트 테마 변수에 이 값을 매핑하면 됩니다. */
:root{
  color-scheme:light;
  --ux-page:#F4F2EE;
  --ux-surface:#FFFFFF;
  --ux-surface-2:#F5F3EF;
  --ux-surface-3:#EAE7E1;
  --ux-ink:#16151B;
  --ux-ink-2:#57535F;
  --ux-ink-3:#8E8A97;
  --ux-line:rgba(22,21,27,.09);
  --ux-line-2:rgba(22,21,27,.17);
  --ux-accent:#6A57F2;
  --ux-accent-2:#2F8FE0;
  --ux-accent-soft:rgba(106,87,242,.12);
  --ux-accent-ink:#FFFFFF;
  --ux-mint:#119C72;
  --ux-warn:#D6731E;
  --ux-danger:#D93A55;
  --ux-glass:rgba(255,255,255,.58);
  --ux-glass-line:rgba(255,255,255,.85);
  --ux-shadow:rgba(40,30,80,.14);
  --ux-shadow-strong:rgba(40,30,80,.3);
  --ux-grad:linear-gradient(120deg,#7B61FF,#3D8BFF 55%,#1FB89A);
  --ux-ease:cubic-bezier(.2,.8,.2,1);
  --ux-spring:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ux-page:#07080D;
    --ux-surface:#13141C;
    --ux-surface-2:#1A1B25;
    --ux-surface-3:#252632;
    --ux-ink:#F4F0E8;
    --ux-ink-2:rgba(244,240,232,.68);
    --ux-ink-3:rgba(244,240,232,.42);
    --ux-line:rgba(255,255,255,.08);
    --ux-line-2:rgba(255,255,255,.16);
    --ux-accent:#B7A4FF;
    --ux-accent-2:#7DB4FF;
    --ux-accent-soft:rgba(183,164,255,.15);
    --ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;
    --ux-danger:#FF7D8C;
    --ux-glass:rgba(255,255,255,.07);
    --ux-glass-line:rgba(255,255,255,.18);
    --ux-shadow:rgba(0,0,0,.45);
    --ux-shadow-strong:rgba(0,0,0,.72);
    --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ux-page:#07080D;
  --ux-surface:#13141C;
  --ux-surface-2:#1A1B25;
  --ux-surface-3:#252632;
  --ux-ink:#F4F0E8;
  --ux-ink-2:rgba(244,240,232,.68);
  --ux-ink-3:rgba(244,240,232,.42);
  --ux-line:rgba(255,255,255,.08);
  --ux-line-2:rgba(255,255,255,.16);
  --ux-accent:#B7A4FF;
  --ux-accent-2:#7DB4FF;
  --ux-accent-soft:rgba(183,164,255,.15);
  --ux-accent-ink:#0B0C12;
  --ux-mint:#7EE8C0;
  --ux-warn:#FFB26B;
  --ux-danger:#FF7D8C;
  --ux-glass:rgba(255,255,255,.07);
  --ux-glass-line:rgba(255,255,255,.18);
  --ux-shadow:rgba(0,0,0,.45);
  --ux-shadow-strong:rgba(0,0,0,.72);
  --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
}
/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}
</style>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:48px 24px;background:var(--ux-page);box-sizing:border-box}
.ux-theme-btn{position:fixed;top:16px;right:16px;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--ux-line-2);background:var(--ux-surface);color:var(--ux-ink);font:600 13px/1 system-ui,sans-serif;cursor:pointer}
</style>
</head>
<body>
<button class="ux-theme-btn" type="button" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">Light / Dark</button>
<style>
.u075{position:relative;width:350px;height:330px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.u075-add{align-self:flex-start;height:46px;padding:0 18px 0 14px;border:0;border-radius:999px;display:inline-flex;align-items:center;gap:8px;background:var(--ux-ink);color:var(--ux-page);font-size:14px;font-weight:750;transition:transform .3s var(--ux-spring),opacity .3s}
.u075-add:active{transform:scale(.95)}
.u075-add:focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.u075-add svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.u075-add[aria-disabled="true"]{opacity:.4}
.u075-pan{border-radius:22px;background:var(--ux-surface);box-shadow:0 0 0 1px var(--ux-line),0 24px 44px -24px var(--ux-shadow-strong);overflow:hidden;transform:translateY(30px);opacity:0;transition:transform .5s var(--ux-spring),opacity .3s}
.u075.is-on .u075-pan{transform:none;opacity:1}
.u075-hd{display:flex;align-items:center;gap:12px;width:100%;height:66px;padding:0 14px;border:0;background:none;text-align:left}
.u075-hd:focus-visible{outline:2px solid var(--ux-accent);outline-offset:-3px;border-radius:22px}
.u075-ring{position:relative;width:38px;height:38px;flex:none}
.u075-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.u075-ring circle{fill:none;stroke-width:3.5}
.u075-ring .t{stroke:var(--ux-surface-3)}
.u075-ring .p{stroke:var(--ux-accent);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:calc(100 - var(--p,0) * 100);transition:stroke .3s}
.u075-ring i{position:absolute;inset:0;display:grid;place-items:center;color:var(--ux-mint);opacity:0;transform:scale(.5);transition:opacity .3s,transform .45s var(--ux-spring)}
.u075-ring i svg{width:18px;height:18px;transform:none;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.u075.is-done .u075-ring .p{stroke:var(--ux-mint)}
.u075.is-done .u075-ring i{opacity:1;transform:none}
.u075-ht{flex:1;min-width:0}
.u075-ht b{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.02em}
.u075-ht small{display:block;margin-top:2px;font-size:12px;font-weight:650;color:var(--ux-ink-3);font-variant-numeric:tabular-nums}
.u075-chev{width:18px;height:18px;fill:none;stroke:var(--ux-ink-3);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s var(--ux-spring)}
.u075.is-fold .u075-chev{transform:rotate(180deg)}
.u075-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .45s var(--ux-ease)}
.u075.is-fold .u075-body{grid-template-rows:0fr}
.u075-body>ul{min-height:0;overflow:hidden;margin:0;padding:0 8px;list-style:none}
.u075-f{display:flex;align-items:center;gap:12px;padding:10px 6px;border-top:1px solid var(--ux-line)}
.u075-f:last-child{padding-bottom:14px}
.u075-ic{width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--c);color:#fff;font-size:10px;font-weight:850;letter-spacing:.02em}
.u075-fx{flex:1;min-width:0}
.u075-fx>b{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:720}
.u075-fx b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u075-fx b small{flex:none;font-size:11.5px;font-weight:700;color:var(--ux-ink-3);font-variant-numeric:tabular-nums}
.u075-bar{display:block;height:5px;margin-top:7px;border-radius:3px;background:var(--ux-surface-3);overflow:hidden}
.u075-bar i{display:block;height:100%;width:100%;border-radius:inherit;background:var(--ux-accent);transform-origin:0 50%;transform:scaleX(var(--p,0));transition:background-color .3s}
.u075-f.ok .u075-bar i{background:var(--ux-mint)}
.u075-f.bad .u075-bar i{background:var(--ux-danger)}
.u075-f.bad .u075-fx b small{color:var(--ux-danger)}
.u075-st{width:30px;height:30px;flex:none;display:grid;place-items:center}
.u075-st svg{width:18px;height:18px;fill:none;stroke:var(--ux-mint);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.u075-st path{stroke-dasharray:18;stroke-dashoffset:18;transition:stroke-dashoffset .35s var(--ux-ease)}
.u075-f.ok .u075-st path{stroke-dashoffset:0}
.u075-retry{width:30px;height:30px;border:0;padding:0;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--ux-danger) 12%,transparent);color:var(--ux-danger);animation:u075-in .4s var(--ux-spring)}
.u075-retry svg{stroke:currentColor;width:16px;height:16px}
.u075-retry path{stroke-dasharray:none;stroke-dashoffset:0}
.u075-retry:focus-visible{outline:2px solid var(--ux-accent);outline-offset:2px}
@keyframes u075-in{from{transform:scale(0)}}
</style>
<div class="ux u075">
  <button class="u075-add" type="button"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M9 12.5V3.5M5 7l4-4 4 4M3 13v1.5h12V13"/></svg>Upload files</button>
  <section class="u075-pan" aria-label="Uploads" aria-hidden="true">
    <button class="u075-hd" type="button" aria-expanded="true" tabindex="-1"><span class="u075-ring" aria-hidden="true"><svg viewBox="0 0 38 38"><circle class="t" cx="19" cy="19" r="16"/><circle class="p" cx="19" cy="19" r="16" pathLength="100"/></svg><i><svg viewBox="0 0 18 18"><path d="M4 9.4l3.2 3.2L14 5.6"/></svg></i></span><span class="u075-ht" aria-live="polite"><b></b><small></small></span><svg class="u075-chev" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 7l4 4 4-4"/></svg></button>
    <div class="u075-body"><ul></ul></div>
  </section>
</div>
<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var add = root.querySelector('.u075-add'), pan = root.querySelector('.u075-pan'), hd = root.querySelector('.u075-hd'), ul = root.querySelector('.u075-body ul');
  var hb = hd.querySelector('b'), hs = hd.querySelector('small');
  var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var F = [['Brand guide.pdf', 12.4, 'PDF', 'linear-gradient(140deg,#FF6B8B,#E5484D)', 1.6], ['Main video.mp4', 48, 'MP4', 'linear-gradient(140deg,#7B61FF,#3D8BFF)', 0.9], ['Icon set.zip', 3.2, 'ZIP', 'linear-gradient(140deg,#FFB547,#FF7A45)', 2.4]];
  var files = [], raf = 0, last = 0, failed = false;
  function build() {
    ul.innerHTML = '';
    files = F.map(function (f) {
      var li = document.createElement('li');
      li.className = 'u075-f';
      li.innerHTML = '<span class="u075-ic" style="--c:' + f[3] + '" aria-hidden="true">' + f[2] + '</span><span class="u075-fx"><b><span></span><small></small></b><span class="u075-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i></i></span></span><span class="u075-st"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M4 9.4l3.2 3.2L14 5.6"/></svg></span>';
      li.querySelector('b span').textContent = f[0];
      li.querySelector('.u075-bar').setAttribute('aria-label', f[0] + ' progress');
      ul.appendChild(li);
      return { li: li, p: 0, size: f[1], speed: f[4], state: 'up' };
    });
  }
  function paint() {
    var tot = 0, done = 0, remain = 0, active = 0;
    files.forEach(function (f) {
      tot += f.size; done += f.size * f.p;
      f.li.querySelector('.u075-bar').style.setProperty('--p', f.p.toFixed(3));
      f.li.querySelector('.u075-bar').setAttribute('aria-valuenow', Math.round(f.p * 100));
      f.li.querySelector('small').textContent = f.state === 'bad' ? 'Failed · ' + Math.round(f.p * 100) + '%' : f.state === 'ok' ? f.size + 'MB' : Math.round(f.p * 100) + '%';
      if (f.state === 'up') { active++; remain = Math.max(remain, (1 - f.p) / (f.speed * 0.18)); }
    });
    var all = done / tot, ok = files.filter(function (f) { return f.state === 'ok'; }).length, bad = files.filter(function (f) { return f.state === 'bad'; }).length;
    hd.querySelector('.u075-ring').style.setProperty('--p', all.toFixed(3));
    root.classList.toggle('is-done', ok === files.length);
    if (ok === files.length) { hb.textContent = 'Uploaded ' + ok + ' files'; hs.textContent = 'Total ' + tot.toFixed(1) + 'MB'; }
    else if (active) { hb.textContent = 'Uploading ' + active + (active === 1 ? ' file' : ' files'); hs.textContent = Math.round(all * 100) + '% · about ' + Math.max(1, Math.ceil(remain)) + 's left'; }
    else if (bad) { hb.textContent = bad + (bad === 1 ? ' file failed' : ' files failed'); hs.textContent = 'Press retry to resume'; }
  }
  function loop(now) {
    if (!root.isConnected) return;
    var dt = Math.min(64, now - last) / 1000; last = now;
    var running = false;
    files.forEach(function (f) {
      if (f.state !== 'up') return;
      running = true;
      f.p = Math.min(1, f.p + dt * f.speed * 0.18 * (rm ? 4 : 1));
      if (!failed && f.size === 48 && f.p >= 0.64) { failed = true; f.state = 'bad'; f.li.classList.add('bad'); retryBtn(f); }
      else if (f.p >= 1) { f.state = 'ok'; f.li.classList.add('ok'); }
    });
    paint();
    if (running) raf = requestAnimationFrame(loop);
    else add.setAttribute('aria-disabled', 'false');
  }
  function retryBtn(f) {
    var st = f.li.querySelector('.u075-st'), b = document.createElement('button');
    b.type = 'button'; b.className = 'u075-retry'; b.setAttribute('aria-label', 'Retry Main video');
    b.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v2.5h-2.5"/></svg>';
    st.innerHTML = ''; st.appendChild(b);
    b.addEventListener('click', function () {
      f.state = 'up'; f.li.classList.remove('bad');
      st.innerHTML = '<svg viewBox="0 0 18 18" aria-hidden="true"><path d="M4 9.4l3.2 3.2L14 5.6"/></svg>';
      cancelAnimationFrame(raf); last = performance.now(); raf = requestAnimationFrame(loop);
      hd.focus({ preventScroll: true });
    });
  }
  add.addEventListener('click', function () {
    if (add.getAttribute('aria-disabled') === 'true') return;
    add.setAttribute('aria-disabled', 'true');
    failed = false; build();
    root.classList.add('is-on'); root.classList.remove('is-fold');
    pan.setAttribute('aria-hidden', 'false'); hd.tabIndex = 0; hd.setAttribute('aria-expanded', 'true');
    cancelAnimationFrame(raf); last = performance.now(); raf = requestAnimationFrame(loop);
  });
  hd.addEventListener('click', function () {
    var fold = !root.classList.contains('is-fold');
    root.classList.toggle('is-fold', fold);
    hd.setAttribute('aria-expanded', String(!fold));
  });
  add.click();
})();
</script>
</body>
</html>
