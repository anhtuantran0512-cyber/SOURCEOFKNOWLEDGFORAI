<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Face-changing satisfaction slider · lucianLabs UI</title>
<style>
/* lucianLabs UI 요소 — 공통 테마 토큰 (라이트 / 다크)
   라이트 기본값 → 시스템이 다크면 다크 → data-theme으로 명시하면 그 값을 우선합니다.
   요소 CSS는 --ux-* 토큰만 참조하므로, 프로젝트 테마 변수에 이 값을 매핑하면 됩니다. */
:root{
  color-scheme:light;
  --ux-page:#F4F2EE;
  --ux-surface:#FFFFFF;
  --ux-surface-2:#F5F3EF;
  --ux-surface-3:#EAE7E1;
  --ux-ink:#16151B;
  --ux-ink-2:#57535F;
  --ux-ink-3:#8E8A97;
  --ux-line:rgba(22,21,27,.09);
  --ux-line-2:rgba(22,21,27,.17);
  --ux-accent:#6A57F2;
  --ux-accent-2:#2F8FE0;
  --ux-accent-soft:rgba(106,87,242,.12);
  --ux-accent-ink:#FFFFFF;
  --ux-mint:#119C72;
  --ux-warn:#D6731E;
  --ux-danger:#D93A55;
  --ux-glass:rgba(255,255,255,.58);
  --ux-glass-line:rgba(255,255,255,.85);
  --ux-shadow:rgba(40,30,80,.14);
  --ux-shadow-strong:rgba(40,30,80,.3);
  --ux-grad:linear-gradient(120deg,#7B61FF,#3D8BFF 55%,#1FB89A);
  --ux-ease:cubic-bezier(.2,.8,.2,1);
  --ux-spring:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ux-page:#07080D;
    --ux-surface:#13141C;
    --ux-surface-2:#1A1B25;
    --ux-surface-3:#252632;
    --ux-ink:#F4F0E8;
    --ux-ink-2:rgba(244,240,232,.68);
    --ux-ink-3:rgba(244,240,232,.42);
    --ux-line:rgba(255,255,255,.08);
    --ux-line-2:rgba(255,255,255,.16);
    --ux-accent:#B7A4FF;
    --ux-accent-2:#7DB4FF;
    --ux-accent-soft:rgba(183,164,255,.15);
    --ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;
    --ux-danger:#FF7D8C;
    --ux-glass:rgba(255,255,255,.07);
    --ux-glass-line:rgba(255,255,255,.18);
    --ux-shadow:rgba(0,0,0,.45);
    --ux-shadow-strong:rgba(0,0,0,.72);
    --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ux-page:#07080D;
  --ux-surface:#13141C;
  --ux-surface-2:#1A1B25;
  --ux-surface-3:#252632;
  --ux-ink:#F4F0E8;
  --ux-ink-2:rgba(244,240,232,.68);
  --ux-ink-3:rgba(244,240,232,.42);
  --ux-line:rgba(255,255,255,.08);
  --ux-line-2:rgba(255,255,255,.16);
  --ux-accent:#B7A4FF;
  --ux-accent-2:#7DB4FF;
  --ux-accent-soft:rgba(183,164,255,.15);
  --ux-accent-ink:#0B0C12;
  --ux-mint:#7EE8C0;
  --ux-warn:#FFB26B;
  --ux-danger:#FF7D8C;
  --ux-glass:rgba(255,255,255,.07);
  --ux-glass-line:rgba(255,255,255,.18);
  --ux-shadow:rgba(0,0,0,.45);
  --ux-shadow-strong:rgba(0,0,0,.72);
  --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
}
/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}
</style>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:48px 24px;background:var(--ux-page);box-sizing:border-box}
.ux-theme-btn{position:fixed;top:16px;right:16px;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--ux-line-2);background:var(--ux-surface);color:var(--ux-ink);font:600 13px/1 system-ui,sans-serif;cursor:pointer}
</style>
</head>
<body>
<button class="ux-theme-btn" type="button" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">Light / Dark</button>
<style>
.u380{position:relative;width:340px;height:350px;display:flex;flex-direction:column;align-items:center;padding:20px;border-radius:28px;background:color-mix(in oklab,var(--bg,#FFD43B) 20%,var(--ux-surface));box-shadow:0 0 0 1px var(--ux-line),0 30px 60px -36px var(--ux-shadow-strong);overflow:hidden}
.u380-q{margin:0;font-size:15px;font-weight:800;letter-spacing:-.02em}
.u380-face{width:132px;height:132px;margin-top:14px;overflow:visible}
.u380-face .hd{fill:var(--bg,#FFD43B)}
.u380-face .ft{fill:none;stroke:#2B2118;stroke-width:5;stroke-linecap:round}
.u380-face .ey{fill:#2B2118}
.u380-face .ck{fill:#FF6B6B}
.u380-face .mo{fill:#2B2118;stroke-linejoin:round}
.u380-face .tg{fill:#FF8A8A}
.u380-lb{position:relative;height:26px;margin-top:12px;overflow:hidden;text-align:center}
.u380-lb span{display:block;font-size:19px;line-height:26px;font-weight:850;letter-spacing:-.03em;transition:transform .5s var(--ux-spring)}
.u380-sl{position:relative;width:100%;margin-top:auto}
.u380-r{width:100%;height:34px;margin:0;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
.u380-r::-webkit-slider-runnable-track{height:10px;border-radius:10px;background:linear-gradient(90deg,#FF6B6B,#FFD43B,#51CF66)}
.u380-r::-moz-range-track{height:10px;border-radius:10px;background:linear-gradient(90deg,#FF6B6B,#FFD43B,#51CF66)}
.u380-r::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-9px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--bg,#FFD43B),0 4px 10px rgba(0,0,0,.25)}
.u380-r::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--bg,#FFD43B),0 4px 10px rgba(0,0,0,.25)}
.u380-send{width:100%;height:44px;margin-top:10px;border:0;border-radius:14px;background:var(--ux-ink);color:var(--ux-page);font-size:14px;font-weight:800;transition:transform .35s var(--ux-spring)}
.u380-send:active{transform:scale(.96)}

.u380-ty{position:absolute;left:0;right:0;top:198px;margin:0;text-align:center;font-size:19px;line-height:26px;font-weight:850;letter-spacing:-.03em;color:var(--ux-ink);opacity:0;pointer-events:none}
.u380.is-sent .u380-ty{animation:u380-ty 1.9s var(--ux-ease)}
.u380.is-sent .u380-lb{animation:u380-lh 1.9s var(--ux-ease)}
@keyframes u380-ty{0%{opacity:0;transform:translateY(12px)}15%,82%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}
@keyframes u380-lh{0%{opacity:1}12%,86%{opacity:0}100%{opacity:1}}
@media (prefers-reduced-motion: reduce){.u380.is-sent .u380-ty,.u380.is-sent .u380-lb{animation:none}}
</style>
<div class="ux u380">
  <p class="u380-q">How was this order?</p>
  <svg class="u380-face" viewBox="0 0 132 132" aria-hidden="true">
    <circle class="hd" cx="66" cy="66" r="62"/>
    <ellipse class="ck" cx="34" cy="82" rx="11" ry="7"/><ellipse class="ck" cx="98" cy="82" rx="11" ry="7"/>
    <path class="ft br l"/><path class="ft br r"/>
    <ellipse class="ey l" cx="46" cy="60" rx="6" ry="8"/><ellipse class="ey r" cx="86" cy="60" rx="6" ry="8"/>
    <path class="ft ea" d="M37 63 Q46 52 55 63 M77 63 Q86 52 95 63"/>
    <path class="ft mo"/>
    <defs><clipPath class="mc"><path class="mp"/></clipPath></defs>
    <ellipse class="tg" cx="66" rx="11" ry="7"/>
  </svg>
  <div class="u380-lb" aria-hidden="true"><span class="u380-lbs"></span></div>
  <p class="u380-ty" role="status"></p>
  <div class="u380-sl"><input class="u380-r" type="range" min="0" max="100" value="55" aria-label="Satisfaction"></div>
  <button class="u380-send" type="button">Send</button>
</div>
<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var r = root.querySelector('.u380-r'), face = root.querySelector('.u380-face'), lbs = root.querySelector('.u380-lbs'), ty = root.querySelector('.u380-ty');
  var mo = face.querySelector('.mo'), bl = face.querySelector('.br.l'), br = face.querySelector('.br.r'), el = face.querySelector('.ey.l'), er = face.querySelector('.ey.r'), cks = face.querySelectorAll('.ck');
  var ea = face.querySelector('.ea'), tg = face.querySelector('.tg'), mp = face.querySelector('.mp'), mc = face.querySelector('.mc');
  var cid = 'u380' + Math.random().toString(36).slice(2, 7); mc.id = cid; tg.setAttribute('clip-path', 'url(#' + cid + ')');
  var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var LABELS = ['Not great', 'Could be better', 'It’s okay', 'Good', 'Loved it'];
  lbs.innerHTML = LABELS.map(function (l) { return '<span></span>'; }).join('');
  Array.prototype.forEach.call(lbs.children, function (s, i) { s.textContent = LABELS[i]; });
  var shown = 55, target = 55, raf = 0, lastStep = -1;
  function mix(a, b, t) { return a + (b - a) * t; }
  function hex(c1, c2, t) {
    var a = [parseInt(c1.slice(1, 3), 16), parseInt(c1.slice(3, 5), 16), parseInt(c1.slice(5, 7), 16)], b = [parseInt(c2.slice(1, 3), 16), parseInt(c2.slice(3, 5), 16), parseInt(c2.slice(5, 7), 16)];
    return 'rgb(' + a.map(function (v, i) { return Math.round(mix(v, b[i], t)); }).join(',') + ')';
  }
  function cl(x) { return Math.max(0, Math.min(1, x)); }
  function draw(v) {
    var t = v / 100;
    var tilt = t < 0.5 ? mix(9, 0, t / 0.5) : 0, by = 40 - Math.max(0, t - 0.5) * 12, arc = t > 0.5 ? -(t - 0.5) * 9 : 0;
    bl.setAttribute('d', 'M34 ' + (by - tilt).toFixed(1) + ' Q45 ' + (by + arc).toFixed(1) + ' 56 ' + (by + tilt).toFixed(1));
    br.setAttribute('d', 'M98 ' + (by - tilt).toFixed(1) + ' Q87 ' + (by + arc).toFixed(1) + ' 76 ' + (by + tilt).toFixed(1));
    var sq = cl((t - 0.6) / 0.2), happy = t >= 0.8;
    [el, er].forEach(function (e) { e.setAttribute('ry', mix(8, 2.2, sq).toFixed(2)); e.setAttribute('rx', mix(6, 7.5, sq).toFixed(2)); e.setAttribute('opacity', happy ? 0 : 1); });
    ea.setAttribute('opacity', happy ? 1 : 0);
    var curve = mix(-16, 14, cl(t / 0.68)), w = mix(20, 27, t), y = mix(98, 90, t), open = cl((t - 0.68) / 0.28);
    var cu = mix(curve, 6, open), clw = mix(cu, 46, open), wl = w + open * 3;
    var md = 'M' + (66 - wl).toFixed(1) + ' ' + y.toFixed(1) + ' Q66 ' + (y + cu).toFixed(1) + ' ' + (66 + wl).toFixed(1) + ' ' + y.toFixed(1) + ' C' + (66 + wl * 0.8).toFixed(1) + ' ' + (y + clw * 0.68).toFixed(1) + ' ' + (66 - wl * 0.8).toFixed(1) + ' ' + (y + clw * 0.68).toFixed(1) + ' ' + (66 - wl).toFixed(1) + ' ' + y.toFixed(1) + 'Z';
    mo.setAttribute('d', md); mp.setAttribute('d', md);
    tg.setAttribute('cy', (y + clw * 0.44).toFixed(1)); tg.setAttribute('rx', (wl * 0.46).toFixed(1)); tg.setAttribute('opacity', cl((open - 0.3) * 2.5).toFixed(2));
    cks.forEach(function (c) { c.setAttribute('opacity', Math.max(0, (t - 0.5) * 1.6).toFixed(2)); });
    root.style.setProperty('--bg', t < 0.5 ? hex('#FF8787', '#FFD43B', t * 2) : hex('#FFD43B', '#69DB7C', (t - 0.5) * 2));
    var step = Math.min(4, Math.floor(t * 5));
    if (step !== lastStep) {
      lastStep = step;
      Array.prototype.forEach.call(lbs.children, function (s) { s.style.transform = 'translateY(' + (-26 * step) + 'px)'; });
      r.setAttribute('aria-valuetext', LABELS[step]);
    }
  }
  function tick() {
    raf = 0;
    if (!root.isConnected) return;
    shown += (target - shown) * 0.25;
    if (Math.abs(target - shown) < 0.2) shown = target; else raf = requestAnimationFrame(tick);
    draw(shown);
  }
  r.addEventListener('input', function () { target = +r.value; if (rm) { shown = target; draw(shown); } else if (!raf) raf = requestAnimationFrame(tick); });
  root.querySelector('.u380-send').addEventListener('click', function () {
    ty.textContent = 'Thanks for the feedback!';
    root.classList.remove('is-sent'); void root.offsetWidth; root.classList.add('is-sent');
    if (!rm && face.animate) face.animate([{ transform: 'none' }, { transform: 'translateY(8px) rotate(-3deg)', offset: 0.3 }, { transform: 'translateY(-4px)', offset: 0.6 }, { transform: 'translateY(6px)', offset: 0.8 }, { transform: 'none' }], { duration: 900, easing: 'ease-in-out' });
  });
  draw(55);
})();
</script>
</body>
</html>
