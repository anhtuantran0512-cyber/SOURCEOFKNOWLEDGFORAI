:root{
 --bg:#06070c;
 --text:#e8ebf7;
 --text-soft:rgba(232,235,247,.72);
 --muted:rgba(232,235,247,.4);
 --tint-a:.1;
 --tint-b:.03;
 --glass-edge:rgba(255,255,255,calc(.14*var(--edge,0.55)));
 --glass-rim:rgba(255,255,255,calc(.32*var(--edge,0.55)));
 --glass-rim-low:rgba(255,255,255,calc(.08*var(--edge,0.55)));
 --glass-glow:rgba(140,170,255,.07);
 --glass-sheen:rgba(255,255,255,.1);
 --glass-shadow:0 16px 48px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
 --chip:rgba(255,255,255,.05);
 --chip-hover:rgba(255,255,255,.12);
 --chip-edge:rgba(255,255,255,.1);
 --accent:#7aa2ff;
 --thumb:rgba(255,255,255,.14);
 --focus:rgba(122,162,255,.3);
 --edge:.55;
 --tint:0;
 --blur:6px;
}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:Geist,ui-sans-serif,system-ui,sans-serif;color:var(--text)}
*{box-sizing:border-box}
.glass{
 position:fixed;
 isolation:isolate;
 background:linear-gradient(135deg,rgba(255,255,255,calc(var(--tint-a)*var(--tint,0))),rgba(255,255,255,calc(var(--tint-b)*var(--tint,0))));
 border:1px solid var(--glass-edge);
 box-shadow:inset 1px 1px 0 var(--glass-rim),inset -1px -1px 0 var(--glass-rim-low),inset 0 0 24px var(--glass-glow),var(--glass-shadow);
 backdrop-filter:blur(var(--blur,6px)) saturate(180%);
 -webkit-backdrop-filter:blur(var(--blur,6px)) saturate(180%);
 transition:background .4s,border-color .4s,box-shadow .4s;
}
html.liquid .glass{backdrop-filter:url(#liquid-glass) blur(var(--blur,6px)) saturate(180%);-webkit-backdrop-filter:url(#liquid-glass) blur(var(--blur,6px)) saturate(180%)}
.glass::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:linear-gradient(180deg,var(--glass-sheen),transparent 48%);pointer-events:none}
#liquid-svg{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
.field{display:block;width:100vw;height:100vh;touch-action:none}
.topbar{
 position:fixed;z-index:30;top:18px;left:50%;transform:translate(-50%,0);
 display:flex;gap:8px;align-items:center;justify-content:center;
}
.choices{
 position:relative;
 display:flex;gap:2px;padding:4px;border-radius:999px;--blur:5px;
 max-width:max(240px,calc(100vw - 300px));
 overflow-x:auto;scrollbar-width:none;
}
.choices::-webkit-scrollbar{display:none}
.thumb{
 position:absolute;top:4px;left:0;height:32px;border-radius:999px;background:var(--thumb);
 box-shadow:inset 0 1px 0 var(--glass-rim),0 2px 8px rgba(0,0,0,.12);
 transform:translate(0,0);
 transition:transform .35s cubic-bezier(.3,1.3,.5,1),width .35s cubic-bezier(.3,1.3,.5,1),height .35s cubic-bezier(.3,1.3,.5,1);
 pointer-events:none;
}
.choice{
 display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px 0 11px;
 border:0;background:transparent;border-radius:999px;
 font:500 13px Geist,system-ui;white-space:nowrap;cursor:pointer;
 color:var(--muted);transition:color .3s;
}
.choice:hover{color:var(--text-soft)}
.choice[aria-checked="true"]{color:var(--text)}
.choice .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.stage{

}

}

  repeating-linear-gradient(176deg,rgba(255,255,255,.55) 0 2px,rgba(0,0,0,.22) 2px 5px),

.greeting{

.composer:focus-within{border-color:rgba(122,162,255,calc(.3*var(--edge,0.55)));box-shadow:inset 1px 1px 0 var(--glass-rim),inset -1px -1px 0 var(--glass-rim-low),inset 0 0 24px var(--glass-glow),var(--glass-shadow),0 0 0 3px rgba(122,162,255,calc(.12*var(--edge,0.55)))}
.row1{display:flex;gap:10px;align-items:flex-start}

.group:first-child{border-top:0;margin-top:0}
.group-title{font:600 10px "Geist Mono",ui-monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}

.row-label span{font:500 12px Geist,system-ui;color:var(--text-soft)}
.row-label .val{font:600 11px "Geist Mono",ui-monospace;color:var(--text-soft)}
.slider{width:100%;-webkit-appearance:none;appearance:none;height:18px;background:transparent;margin:0;cursor:pointer}
.slider::-webkit-slider-runnable-track{height:4px;border-radius:999px;background:linear-gradient(to right,var(--accent) var(--fill,50%),var(--chip-edge) var(--fill,50%));}

.slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.1);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.toggle{width:30px;height:18px;border-radius:999px;background:var(--chip-edge);position:relative;cursor:pointer;border:1px solid var(--chip-edge);transition:background .2s}
.toggle.on{background:var(--accent)}
.toggle .knob{position:absolute;top:1px;left:1px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.toggle.on .knob{transform:translateX(12px)}
.row-wrap{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;margin-bottom:10px}
.row-wrap.disabled{opacity:.4;pointer-events:none}
.tooltip{
 position:fixed;max-width:240px;padding:8px 10px;border-radius:12px;background:#0e101aeb;border:1px solid rgba(255,255,255,.08);
 font:500 11px Geist,system-ui;color:var(--text-soft);line-height:1.4;pointer-events:none;z-index:100;display:none;backdrop-filter:blur(12px);
}
@media (max-width:920px){

}

}

}
@media (prefers-reduced-motion:reduce){
 .thumb,.choice,.glass{transition:none!important}
}

<body>
<svg id="liquid-svg" aria-hidden="true"><defs><filter id="liquid-glass" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.007 0.011" numOctaves="2" seed="11" result="noise"/><feGaussianBlur in="noise" stdDeviation="2" result="blur"/><feDisplacementMap in="SourceGraphic" in2="blur" scale="40" xChannelSelector="R" yChannelSelector="G"/></filter></defs></svg>
<canvas class="field" aria-hidden="true"></canvas>
<nav class="topbar" aria-label="Animal species">
 <div class="choices glass" role="radiogroup" aria-label="Animal">
  <span class="thumb" aria-hidden="true"></span>
 </div>
</nav>
<main class="stage">
 <div class="masthead">
  <div class="avatar" aria-hidden="true"></div>
  <h1 class="greeting" id="greeting"></h1>
 </div>
 <form class="composer glass" id="composer" autocomplete="off">
  <div class="row1">
   <svg class="searchicon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="2"/><path d="M15.5,15.5 L20.5,20.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
   <textarea id="prompt" rows="1" placeholder="Ask anything..."></textarea>
  </div>
  <div class="row2">
   <button type="button" class="pill-plus" id="addBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Add tabs or files</span></button>
   <div class="right-actions">
    <button type="button" class="icon-btn" aria-label="Microphone"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="9" y="4" width="6" height="10" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M6 12.5c0 3.3 2.7 6 6 6s6-2.7 6-6M12 18.5V22" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
    <button type="submit" class="send-btn" id="sendBtn" disabled aria-label="Send"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 18V6M12 6l-5 5M12 6l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
   </div>
  </div>
 </form>
</main>
<p class="hint">click to scatter</p>
<div class="tooltip" id="tooltip"></div>
<script>

(() => {
const SPECIES_ORDER=["moth","rabbit","turtle","squid","owl","flyingfish","eagle"];
const LABELS={moth:"Moth",rabbit:"Rabbit",turtle:"Sea turtle",squid:"Squid",owl:"Owl",flyingfish:"Flying fish",eagle:"Eagle"};
const DOTS={moth:"rgb(232,162,124)",rabbit:"rgb(248,199,181)",turtle:"rgb(109,176,138)",squid:"rgb(232,106,160)",owl:"rgb(217,195,160)",flyingfish:"rgb(133,227,221)",eagle:"rgb(230,233,242)"};
const PARAM_KEY_MAP={moths:"moth",rabbits:"rabbit",turtles:"turtle",squid:"squid",owls:"owl",flyingfish:"flyingfish",eagles:"eagle"};
const SHARED_DEFAULTS={density:1,speed:1,sway:.04,spread:.06,size:1,farthest:.45,farBias:1.6,grip:2,separation:300,hue:0,shimmer:.3,sparkle:.12,fog:.75,trail:1,trailFade:1.3,grid:1.05,detail:1.3,cornerToCorner:0,dir:49};
const SPECIES_CFG={
 moth:{scale:1,area:48000,speed:90,trail:[255,196,156],dir:49,defaults:{density:1.05,speed:1.05,sway:0,spread:0,size:1.25,farthest:.18,farBias:1.7,grip:5,separation:700,trail:1.55,trailFade:.15,flutter:0,glide:2.75,flapRate:1}},
 rabbit:{scale:1.15,area:80000,speed:95,trail:[226,190,168],dir:0,detail:1.7,defaults:{fog:.12,density:1.6,sway:0,spread:0,farthest:.3,farBias:.8,grip:3,separation:420,trail:1.2,trailFade:.35,shimmer:.1,sparkle:.03,burst:1,pause:1,hopSpeed:1,scare:.6}},
 turtle:{scale:1.6,area:110000,speed:46,trail:[110,200,186],dir:49,defaults:{fog:.64,density:1.4,speed:1.4,spread:0,sway:0,farthest:.33,farBias:1.3,grip:2.65,separation:780,trail:3,trailFade:.4,shimmer:.35,sparkle:.08,meander:.4,flipperBeat:1,foodRange:200}},
 squid:{scale:1.55,area:95000,speed:55,trail:[255,140,196],dir:131,defaults:{speed:1.05,sway:.04,spread:.08,farthest:.3,farBias:1.4,grip:1.4,trail:.8,trailFade:.6,sparkle:.1,pulseRate:1,pulsePower:1,pulseGlow:1,armLength:1}},
 owl:{scale:2.1,area:130000,speed:70,trail:[236,212,170],dir:49,defaults:{fog:.26,density:1.5,sway:0,spread:0,farthest:.32,farBias:2.4,grip:5,separation:720,trail:.6,trailFade:1.2,sparkle:.08,hover:1.3,cruising:.5,swoopSpeed:1.3,wingbeat:1}},
 flyingfish:{scale:1.25,area:85000,speed:80,trail:[120,214,226],dir:131,defaults:{fog:0,size:1.2,density:1.3,sway:0,spread:0,farthest:.35,farBias:1.4,separation:450,trail:3.45,trailFade:.4,shimmer:.25,sparkle:.1,howOften:1,leapLength:.6,leapHeight:1}},
 eagle:{scale:1.5,area:60000,speed:82,trail:[200,204,226],dir:49,detail:1.7,defaults:{density:.75,speed:1.4,sway:0,spread:0,farthest:.35,farBias:1.3,grip:3,separation:150,trail:0,shimmer:.1,sparkle:.04,wingbeat:.85,glide:1.6,foldingFlap:0}},
};
const LOOK_DEFAULTS={hue:0,shimmer:.3,sparkle:.12,fog:.75,trail:1,trailFade:1.3,grid:1.05,detail:1.3};
const GLASS_DEFAULTS={blur:3.5,refraction:40,ripple:.007,tint:0,edge:.55,radius:24,width:720};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>Math.random()*(b-a)+a;
function hash2(x,y){ let h=Math.sin(x*127.1+y*311.7)*43758.5453; return h-Math.floor(h);}
function makeHashFor(id,x,y){ return hash2(id*19.17 + x*0.13, y*0.29) }
function safeLocalGet(k){ try{return localStorage.getItem(k);}catch{return null}}
function safeLocalSet(k,v){ try{localStorage.setItem(k,v);}catch{}}
function safeLocalRemove(k){ try{localStorage.removeItem(k);}catch{}}
function hueRotate(rgb, deg){
 if(!deg) return rgb.slice();
 let rad=deg*Math.PI/180;
 let c=Math.cos(rad), s=Math.sin(rad);
 let m=[
  0.213+0.787*c-0.213*s, 0.715-0.715*c-0.715*s, 0.072-0.072*c+0.072*s,
  0.213-0.213*c+0.143*s, 0.715+0.285*c+0.140*s, 0.072-0.072*c-0.283*s,
  0.213-0.213*c-0.787*s, 0.715-0.715*c+0.715*s, 0.072+0.928*c+0.072*s
 ];
 let r=rgb[0],g=rgb[1],b=rgb[2];
 return [
  clamp(m[0]*r + m[1]*g + m[2]*b,0,255),
  clamp(m[3]*r + m[4]*g + m[5]*b,0,255),
  clamp(m[6]*r + m[7]*g + m[8]*b,0,255)
 ];
}
function mixTowardBg(col, fog){ const bg=[6,7,12]; return [lerp(col[0],bg[0],fog),lerp(col[1],bg[1],fog),lerp(col[2],bg[2],fog)]; }
function colorFaded(col,fog,cov){ let f=fog+0.55-0.45*cov; f=clamp(f,0,1); return mixTowardBg(col,f); }
function updateGreeting(){
 const h=new Date().getHours();
 let txt;
 if(h>=5&&h<=11) txt="Good morning, Rosalie";
 else if(h>=12&&h<=16) txt="Good afternoon, Rosalie";
 else if(h>=17&&h<=21) txt="Good evening, Rosalie";
 else txt="Still up, Rosalie?";
 const el=document.getElementById('greeting');
 if(el) el.textContent=txt;
}
updateGreeting(); setInterval(updateGreeting,60000);
const ta=document.getElementById('prompt');
const sendBtn=document.getElementById('sendBtn');
function autoGrow(){ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,200)+'px'; }
ta.addEventListener('input',()=>{ autoGrow(); sendBtn.disabled=!ta.value.trim();});
ta.addEventListener('keydown',e=>{ if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); if(!sendBtn.disabled) submitChat(); }});
document.getElementById('composer').addEventListener('submit',e=>{ e.preventDefault(); if(!sendBtn.disabled) submitChat(); });
function submitChat(){ const text=ta.value; if(!text.trim()) return; window.dispatchEvent(new CustomEvent('chat:submit',{detail:{text}})); ta.value=''; autoGrow(); sendBtn.disabled=true; }
if(window.matchMedia('(pointer:fine)').matches) setTimeout(()=>ta.focus(),100);
const choicesWrap=document.querySelector('.choices');
const thumb=document.querySelector('.thumb');
SPECIES_ORDER.forEach(key=>{
 const btn=document.createElement('button');
 btn.className='choice'; btn.setAttribute('role','radio'); btn.dataset.key=key; btn.type='button'; btn.tabIndex=-1;
 const dot=document.createElement('span'); dot.className='dot'; dot.style.background="radial-gradient(at 35% 30%, color-mix(in srgb,"+DOTS[key]+" 50%, white), "+DOTS[key]+" 70%)";
 btn.append(dot);
 const label=document.createElement('span'); label.textContent=LABELS[key]; btn.append(label);
 btn.addEventListener('click',()=>selectSpecies(key));
 choicesWrap.appendChild(btn);
});
let currentSpecies=null;
let currentTweakValues={};
let glassValues={};
function getSavedTweaks(species){ try{ const raw=safeLocalGet('wild-tab:tweaks:'+species); if(raw) return JSON.parse(raw); }catch{} return null; }
function readUrlParams(){ const url=new URL(location.href); const a=url.searchParams.get('animal'); if(a){ const k=a.toLowerCase(); if(PARAM_KEY_MAP[k]) return PARAM_KEY_MAP[k]; if(SPECIES_ORDER.includes(k)) return k; } return null; }
let urlAnimal=readUrlParams();
let urlCountParam=null; try{ const u=new URL(location.href); const c=u.searchParams.get('count'); if(c) urlCountParam=parseInt(c,10); }catch{}
let startSpecies = urlAnimal || safeLocalGet('wild-tab:animal') || 'moth';
if(!SPECIES_ORDER.includes(startSpecies)) startSpecies='moth';
function buildCurrentConfig(species){
 const cfg=SPECIES_CFG[species];
 const merged=Object.assign({},SHARED_DEFAULTS, cfg.defaults);
 if(cfg.detail!=null) merged.detail=cfg.detail;
 merged.dir = (cfg.dir!=null? cfg.dir : merged.dir);
 const saved=getSavedTweaks(species);
 if(saved){ if(saved.tuning) Object.assign(merged, saved.tuning); if(saved.glass) Object.assign(glassValues, saved.glass); else glassValues=Object.assign({},GLASS_DEFAULTS); } else { glassValues=Object.assign({},GLASS_DEFAULTS); }
 if(!saved || !saved.glass){ glassValues=Object.assign({},GLASS_DEFAULTS); if(saved && saved.glass) Object.assign(glassValues, saved.glass); }
 if(merged.cornerToCorner==null) merged.cornerToCorner=0;
 return merged;
}
function selectSpecies(key){
 if(currentSpecies===key) return;
 currentSpecies=key;
 safeLocalSet('wild-tab:animal',key);
 document.querySelectorAll('.choice').forEach(btn=>{
  const is=btn.dataset.key===key;
  btn.setAttribute('aria-checked',is?'true':'false');
  btn.tabIndex=is?0:-1;
 });
 placeThumb();
 currentTweakValues=buildCurrentConfig(key);
 const saved=getSavedTweaks(key);
 if(saved && saved.glass) glassValues=Object.assign({},GLASS_DEFAULTS, saved.glass); else glassValues=Object.assign({},GLASS_DEFAULTS);
 applyGlass();
 rebuildFlock();
 rebuildPanel();
 updateCanvasFonts();
}
function placeThumb(){
 const sel=document.querySelector('.choice[aria-checked="true"]');
 if(!sel||!thumb) return;
 const left=sel.offsetLeft;

function diffuseTrail(dt){

  const idx=y*trailCols+x;
  const self=trailGrid[idx];
  if(self<=0.0001) continue;
  let sum=self*4;
  if(x>0) sum+=trailGrid[idx-1];
  if(x<trailCols-1) sum+=trailGrid[idx+1];

     else if(kindFinal==='Bright'){ glyphCol=[clamp(fillCol[0]*1.05+50,0,255), clamp(fillCol[1]*1.05+50,0,255), clamp(fillCol[2]*1.05+50,0,255)]; glyphSet=".:*".split(''); }
     else { glyphCol=[fillCol[0]*0.42,fillCol[1]*0.42,fillCol[2]*0.42]; glyphSet=".:;+=*%#".split(''); }
     const ghash=makeHashFor(a.id, Math.round((cellX-drawX)/spanScaled*10), Math.round((cellY-drawY)/spanScaled*10));
     let glyphPick=glyphSet[Math.floor(ghash*glyphSet.length)%glyphSet.length];
     drawCell(cellX,cellY, kindFinal, fillCol, glyphCol, [glyphPick], a.id, gx,gy, fog, shimmer, sparkle);
    }
   }
  }
  if(currentSpecies==='moth' && a.span>70){
   const wob=0.01*Math.sin(time*3+a.id);
   drawLineOnCanvas(drawX,drawY, a, 0.17,0.014, 0.36,0.13+wob, [214,170,130], spanScaled, cosH, sinH);
   drawLineOnCanvas(drawX,drawY, a, 0.17,-0.014, 0.36,-0.13-wob, [214,170,130], spanScaled, cosH, sinH);
  }
  if(currentSpecies==='squid'){
   const armLen= (currentTweakValues.armLength||1);
   for(let i=0;i<8;i++){
    const spread=(i/7 -0.5)*0.12; const bunch=0.55*(a.squeeze||0); const curSpread=spread*(1-bunch);
    const baseU=-0.06, baseV=0; const len=0.42*armLen*(0.85+0.3*Math.random()*0.08); const wob=0.035*Math.sin((a.pulsePhase||0) -3.5*0.2 +1.3*i); const endU=baseU - len*Math.cos(curSpread+wob); const endV=curSpread*len + wob*0.1;
    drawSegmentedLine(drawX,drawY, a, baseU, baseV, endU, endV, [232,104,168], spanScaled, cosH,sinH, 12);
   }
   for(let t=0;t<2;t++){
    const off=t===0?0.04:-0.04; const baseU=-0.06, baseV=off; const len=0.78*(currentTweakValues.armLength||1); const endU=baseU - len, endV=off*0.5;
    drawDottedLine(drawX,drawY,a, baseU,baseV, endU,endV, [232,104,168], spanScaled, cosH,sinH, 22);
    const cx=drawX + (endU*cosH - endV*sinH)*spanScaled; const cy=drawY + (endU*sinH + endV*cosH)*spanScaled;
    ctx.fillStyle='rgb(255,160,204)'; ctx.font='600 '+Math.round(ch*0.74)+'px '+canvasFontFamily; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('o', cx-3, cy); ctx.fillText('@', cx, cy); ctx.fillText('o', cx+3, cy);
    addTrailEnergy(cx,cy, 0.04*a.depth);
   }
  }
  if(currentSpecies==='turtle'){
   for(let s of [-1,1]){ const px=drawX + (0.37*cosH - 0.045*s*sinH)*spanScaled; const py=drawY + (0.37*sinH + 0.045*s*cosH)*spanScaled; ctx.fillStyle='rgb(10,10,10)'; ctx.font='600 '+Math.round(ch*0.74)+'px '+canvasFontFamily; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('\u25CF', px, py); }
  }
  if(currentSpecies==='owl'){ for(let s of [-1,1]){ const px=drawX + (0.135*cosH - 0.045*s*sinH)*spanScaled; const py=drawY + (0.135*sinH + 0.045*s*cosH)*spanScaled; ctx.fillStyle='rgb(20,12,0)'; ctx.font='600 '+Math.round(ch*0.74)+'px '+canvasFontFamily; ctx.fillText('\u25CF', px, py); } }
  if(currentSpecies==='squid'){ for(let s of [-1,1]){ const px=drawX + (-0.055*cosH - 0.06*s*sinH)*spanScaled; const py=drawY + (-0.055*sinH + 0.06*s*cosH)*spanScaled; ctx.fillStyle='rgb(10,10,20)'; ctx.fillText('\u25CF', px, py); } }
  if(currentSpecies==='rabbit'){ const px=drawX + (0.2*cosH - (-0.09)*sinH)*spanScaled; const py=drawY + (0.2*sinH + (-0.09)*cosH)*spanScaled; ctx.fillStyle='rgb(255,240,230)'; ctx.fillRect(px-2,py-2,4,4); ctx.fillStyle='rgb(20,10,10)'; ctx.fillText('\u25CF', px, py); }
  if(currentSpecies==='eagle'){ for(let s of [-1,1]){ const px=drawX + (0.225*cosH - Math.max(0.026,cw/spanScaled)*s*sinH)*spanScaled; const py=drawY + (0.225*sinH + Math.max(0.026,cw/spanScaled)*s*cosH)*spanScaled; ctx.fillStyle='rgb(240,190,70)'; ctx.beginPath(); ctx.arc(px,py,3,0,6.283185); ctx.fillStyle='rgba(240,190,70,0.35)'; ctx.fill(); ctx.fillStyle='rgb(10,10,0)'; ctx.font='600 '+Math.round(ch*0.6)+'px '+canvasFontFamily; ctx.fillText('\u25CF', px, py); } drawLineOnCanvas(drawX,drawY,a, -0.22,0.02, -0.28,0.04, [240,190,70], spanScaled, cosH,sinH); drawLineOnCanvas(drawX,drawY,a, -0.22,-0.02, -0.28,-0.04, [240,190,70], spanScaled, cosH,sinH); }
 }
}
function flyingFishProbeWrapper(u,v,a){ return flyingFishProbe(u,v,a); }
function drawLineOnCanvas(drawX,drawY, animal, u1,v1, u2,v2, col, spanScaled, cosH, sinH){
 const steps= Math.ceil(Math.hypot(u2-u1, v2-v1)*spanScaled / (cw*0.5)); if(steps<1) return;
 for(let i=0;i<=steps;i++){
  const t=i/steps; const u=lerp(u1,u2,t), v=lerp(v1,v2,t);
  const wx=drawX + (u*cosH - v*sinH)*spanScaled; const wy=drawY + (u*sinH + v*cosH)*spanScaled;
  const gx=Math.floor(wx/cw)*cw, gy=Math.floor(wy/ch)*ch;
  const hueCol=hueRotate(col, currentTweakValues.hue);
  const ang=Math.atan2(v2-v1, u2-u1)+ animal.heading; let g="-"; const deg=ang*180/Math.PI;
  if(Math.abs(deg)<20 || Math.abs(deg)>160) g="-"; else if(deg>20&&deg<70) g="/"; else if(deg>70&&deg<110) g="|"; else g="\\";
  ctx.fillStyle='rgb('+hueCol[0]+','+hueCol[1]+','+hueCol[2]+')'; ctx.font='600 '+Math.round(ch*0.74)+'px '+canvasFontFamily; ctx.textBaseline='middle'; ctx.textAlign='center'; ctx.fillText(g, gx+cw/2, gy+ch/2+1);
 }
}
function drawSegmentedLine(drawX,drawY, animal, u1,v1, u2,v2, col, spanScaled, cosH, sinH, segs){
 for(let i=0;i<segs;i++){ const t=i/(segs-1); const u=lerp(u1,u2,t)+ Math.sin((animal.pulsePhase||0) + t*3)*0.01; const v=lerp(v1,v2,t)+ Math.cos((animal.pulsePhase||0)+t*2)*0.008; const wx=drawX + (u*cosH - v*sinH)*spanScaled; const wy=drawY + (u*sinH + v*cosH)*spanScaled; const gx=Math.floor(wx/cw)*cw, gy=Math.floor(wy/ch)*ch; const hueCol=hueRotate(col, currentTweakValues.hue); ctx.fillStyle='rgb('+hueCol[0]+','+hueCol[1]+','+hueCol[2]+')'; ctx.font='600 '+Math.round(ch*0.74)+'px '+canvasFontFamily; ctx.fillText(i%3===0?':': '|', gx+cw/2, gy+ch/2+1); }
}
function drawDottedLine(drawX,drawY, animal, u1,v1, u2,v2, col, spanScaled, cosH, sinH, steps){
 for(let i=0;i<steps;i++){ const t=i/(steps-1); const u=lerp(u1,u2,t), v=lerp(v1,v2,t); const wx=drawX + (u*cosH - v*sinH)*spanScaled; const wy=drawY + (u*sinH + v*cosH)*spanScaled; const gx=Math.floor(wx/cw)*cw, gy=Math.floor(wy/ch)*ch; const hueCol=hueRotate(col, currentTweakValues.hue); ctx.fillStyle='rgb('+hueCol[0]+','+hueCol[1]+','+hueCol[2]+')'; ctx.font='600 '+Math.round(ch*0.74)+'px '+canvasFontFamily; ctx.fillText(t>0.95? 'o' : (i%2===0? ':' : '|' ), gx+cw/2, gy+ch/2+1); }
}
function updateFood(dt){
 for(let i=foodPellets.length-1;i>=0;i--){ const f=foodPellets[i]; f.life-=dt; if(f.life<=0){ foodPellets.splice(i,1); continue; } f.x+= f.vx*dt; f.y+= f.vy*dt; f.vx*= Math.exp(-0.8*dt); f.vy*= Math.exp(-0.8*dt); addTrailEnergy(f.x,f.y, 0.02); }
}
function drawFood(){
 for(let f of foodPellets){
  const fade = f.life< 14*0.3 ? f.life/(14*0.3):1;
  const glyph = fade>0.5? 'o': '.';
  const col=hueRotate([190,226,150], currentTweakValues.hue);
  ctx.fillStyle='rgba('+col[0]+','+col[1]+','+col[2]+','+fade+')';
  ctx.font='600 '+Math.round(ch*0.74)+'px '+canvasFontFamily;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(glyph, f.x, f.y);
 }
}
function updateSnow(dt){
 for(let p of marineSnow){ p.y+= p.speed*dt; p.x+= Math.sin(time*0.3+p.wob)*0.5*dt*10; if(p.y>H+10){ p.y=-10; p.x=Math.random()*W; } if(p.x<0) p.x=W; if(p.x>W) p.x=0; }
}
function drawSnow(){
 if(currentSpecies!=='squid') return;
 const fog=currentTweakValues.fog||0.75;
 for(let p of marineSnow){
  const col=hueRotate([255,176,214], currentTweakValues.hue);
  const faded=mixTowardBg(col, fog*0.6);
  ctx.fillStyle='rgba('+faded[0]+','+faded[1]+','+faded[2]+','+(0.7+0.3*Math.sin(time*0.5+p.wob))+')';
  ctx.font='600 '+Math.round(ch*0.6)+'px '+canvasFontFamily;
  ctx.fillText(p.glyph, p.x, p.y);
 }
}
const mqReduced=window.matchMedia('(prefers-reduced-motion: reduce)');
let reduced=mqReduced.matches;
mqReduced.addEventListener('change',e=>{ reduced=e.matches; if(reduced) stillFrame(); else resumeAnimation(); });
let rafId=null, accumulator=0, lastTime=0;
let paused=false;
const io=new IntersectionObserver(entries=>{ for(let e of entries){ if(e.target===canvas){ if(!e.isIntersecting) paused=true; else { paused=false; if(!reduced) { lastTime=performance.now(); rafId=requestAnimationFrame(loop);} } } } });
io.observe(canvas);
const ro=new ResizeObserver(()=>resize());
ro.observe(canvas);
function step(dt){
 time+=dt;
 if(currentSpecies==='turtle') updateFood(dt);
 if(currentSpecies==='squid') updateSnow(dt);
 diffuseTrail(dt);
 for(let a of animals) stepAnimal(a, dt, time);
}
function draw(){
 if(needBgRepaint) drawBackground();
 ctx.clearRect(0,0,W,H);
 ctx.drawImage(bgCanvas,0,0,W,H);
 if(currentSpecies==='squid') drawSnow();
 drawTrail();
 if(currentSpecies==='turtle') drawFood();
 drawAnimals();
}
function loop(now){
 if(paused||reduced) return;
 if(!lastTime) lastTime=now;
 let dt=Math.min(0.1, (now-lastTime)/1000);
 lastTime=now;
 accumulator+=dt;
 let steps=0;
 while(accumulator>=1/60 && steps<4){ step(1/60); accumulator-=1/60; steps++; }
 draw();
 rafId=requestAnimationFrame(loop);
}
function stillFrame(){
 needBgRepaint=true;
 for(let i=0;i<240;i++) step(1/60);
 draw();
 if(rafId) cancelAnimationFrame(rafId);
 rafId=null;
}
function resumeAnimation(){
 lastTime=performance.now(); accumulator=0;
 if(rafId) cancelAnimationFrame(rafId);
 rafId=requestAnimationFrame(loop);
}
canvas.addEventListener('pointerdown',e=>{
 if(reduced) return;
 const rect=canvas.getBoundingClientRect();
 const x=(e.clientX-rect.left), y=(e.clientY-rect.top);
 stampTrail(x,y,6,1.4);
 if(currentSpecies==='turtle'){
  const n= Math.floor(rand(7,11));
  for(let i=0;i<n;i++){
   const ang=Math.random()*6.283185; const sp=rand(4,14);
   foodPellets.push({x:x+Math.cos(ang)*rand(0,70), y:y+Math.sin(ang)*rand(0,70), vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, life:14});
   if(foodPellets.length>60) foodPellets.shift();
  }
  return;
 }
 for(let a of animals){
  const dx=a.x-x, dy=a.y-y; const d=Math.hypot(dx,dy);
  if(d<240){
   const k=1-d/240;
   a.startled=0.6+0.6*Math.random();
   const ang=Math.atan2(-dy, dx);
   if(currentSpecies==='rabbit' && currentTweakValues.scare>0){ a.fleeTime=(1+1.5*k)*Math.sqrt(currentTweakValues.scare||0.6); a.fleeAng=ang + rand(-0.35,0.35); a.fleeK=k; a.alarm=1; }
   else if(currentSpecies==='owl'){ a.owlState='swoop'; a.stateTime=0.25+0.3*k; }
   else if(currentSpecies==='squid'){ a.pulsePhase=0; a.vx+= Math.cos(ang)*260*k*a.depth; a.vy+= -Math.sin(ang)*260*k*a.depth; }
   else if(currentSpecies==='flyingfish'){ if(!a.leaping){ const power=1+k; const targetX=a.x+Math.cos(ang)*a.span*2.5*power; const targetY=a.y-Math.sin(ang)*a.span*2.5*power; a.leapStart={x:a.x,y:a.y}; a.leapTarget={x:targetX,y:targetY}; a.leapDur=rand(0.42,0.55)*Math.sqrt(currentTweakValues.leapLength||0.6)*0.8; a.leapT=0; a.leaping=true; } }
   else if(currentSpecies==='moth'){ a.vx+= Math.cos(ang)*420*k*a.depth; a.vy+= -Math.sin(ang)*420*k*a.depth; a.glideT=0; }
   else if(currentSpecies==='eagle'){ a.vx+= Math.cos(ang)*200*k*a.depth; a.vy+= -Math.sin(ang)*200*k*a.depth; }
   else { a.vx+= Math.cos(ang)*260*k*a.depth; a.vy+= -Math.sin(ang)*260*k*a.depth; }
  }
 }
});
resize();
selectSpecies(startSpecies);
setTimeout(placeThumb,100);
window.addEventListener('load',()=>{ placeThumb(); });
if(document.fonts){
 document.fonts.ready.then(()=>{
  fontsReady=true; updateCanvasFonts(); if(reduced) stillFrame(); else { needBgRepaint=true; resumeAnimation(); }
 });
 setTimeout(()=>{ if(!fontsReady){ if(reduced) stillFrame(); else resumeAnimation(); } },300);
} else { if(reduced) stillFrame(); else resumeAnimation(); }
let tweakObserver=setInterval(()=>{ if(reduced && needBgRepaint){ draw(); } },200);
window.__glyphAnimals={ selectSpecies, get current(){return currentSpecies}, get animals(){return animals}, get trail(){return trailGrid}};
})();
